[project]
name = "research-agent"
version = "0.1.0"
description = "Keyword-driven research and news collection with LLM enrichment"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "feedparser>=6,<7",
    "httpx>=0.27,<1",
    "lxml>=5.3,<6",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dateutil>=2.9,<3",
    "socksio>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0.35,<3",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP046"]
