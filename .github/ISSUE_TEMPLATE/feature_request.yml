name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个需求背后的使用场景是什么?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作?若有替代方案也可以写在这里。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 采集 / 信源
        - 富化 / 打分
        - 日报 / 文章
        - 推送
        - 前端界面
        - 部署 / 配置
        - 其他
  - type: textarea
    id: alternatives
    attributes:
      label: 其它补充
      description: 参考实现、草图或相关 Issue
