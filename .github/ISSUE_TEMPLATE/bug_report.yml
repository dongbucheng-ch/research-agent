name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈!提交前请先搜索是否已有相同 Issue。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么?你期望的结果是什么?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 /collect
        2. 配置关键词 ……
        3. 观察到 ……
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 采集 / 信源
        - 富化 / 打分
        - 日报 / 文章
        - 推送
        - 前端界面
        - 后端 API / 任务
        - 其他
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: git commit、分支或使用方式(本地 / Docker)
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 任务中心日志、后端控制台输出或界面截图
      render: shell
